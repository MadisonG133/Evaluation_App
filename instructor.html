<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
    <span class="navbar-brand">Instructor Dashboard</span>
    <div class="ms-auto">
      <button type="button" class="btn btn-outline-light me-2" data-target="section-courses">Courses</button>
      <button type="button" class="btn btn-outline-light me-2" data-target="section-teams">Teams</button>
      <button type="button" class="btn btn-outline-light me-2" data-target="section-reviews">Reviews</button>
      <button type="button" class="btn btn-outline-light me-2" data-target="section-schedule">Schedule</button>
      <button type="button" class="btn btn-outline-light" data-target="section-reports">Reports</button>
    </div>
</nav>

<div id="instructorDash" class="container my-5">
  <div id="section-courses" class="dashboard-section">
    <!-- Courses form and list here -->
    <h2>Create Courses</h2>
        <form id="createCourseForm" class="mb-3">
            <div class="mb-3">
                <label for="courseName" class="form-label">Course Name</label>
                <input type="text" class="form-control" id="courseName" placeholder="Enter course name">
            </div>
            <button id="btnCreateCourse" type="button" class="btn btn-primary">Create Course</button>
        </form>
        <ul id="courseList" class="list-group"></ul>

    <h2 class="mt-5">Current Courses</h2>
        <ul id="courseList" class="list-group">
            <li class="list-group-item">CSC3100</li>
            <li class="list-group-item">CSC4320</li>
        </ul>
  </div>

  <div id="section-teams" class="dashboard-section" style="display:none;">
    <h2>Manage Teams</h2>
        <form id="createTeamForm" class="mb-3">
            <div class="mb-3">
                <label for="teamName" class="form-label">Team Name</label>
                <input type="text" class="form-control" id="teamName" placeholder="Enter team name">
            </div>
            <button type="button" class="btn btn-primary">Create Team</button>
        </form>
        <ul id="teamList" class="list-group"></ul>
  </div>

  <div id="section-reviews" class="dashboard-section" style="display:none;">
    <!-- Reviews list here -->
    <h2>View Reviews</h2>
    <ul id="reviewList" class="list-group">
        <li class="list-group-item">Review 1</li>
        <li class="list-group-item">Review 2</li>
        <li class="list-group-item">Review 3</li>
    </ul>
  </div>

  <div id="section-schedule" class="dashboard-section" style="display:none;">
    <!-- Schedule form and list here -->
    <form id="scheduleReviewForm" class="mb-3">
        <div class="mb-3">
            <label for="reviewDate" class="form-label">Review Date</label>
            <input type="date" class="form-control" id="reviewDate">
        </div>
        <button type="button" class="btn btn-primary">Schedule Review</button>
    </form>
    <ul id="scheduleList" class="list-group"></ul>
  </div>

  <div id="section-reports" class="dashboard-section" style="display:none;">
    <!-- Generate Reports section here -->
    <h2>Generate Reports</h2>
    <button type="button" class="btn btn-primary">Generate Report</button>
  </div>
</div>
